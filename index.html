<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新商品導入フロー｜進捗管理</title>
<style>
  :root{
    --paper:#f6f7f5; --surface:#ffffff; --surface-2:#eef1ef; --surface-3:#e6eae7;
    --ink:#18201e; --ink-soft:#3f4744; --muted:#727a76; --faint:#a7aeaa;
    --line:#e2e6e3; --line-strong:#cfd5d1;
    --accent:#0e5c63; --accent-ink:#0b4a50; --accent-soft:#dbebec;
    --gate:#8a5a12; --gate-soft:#f4ead6;
    --ok:#2f9e57; --ok-bg:#e4f4ea; --warn:#c58a17; --warn-bg:#f8eecf; --bad:#c0392b; --bad-bg:#f7e2df;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,30,28,.05),0 4px 14px -10px rgba(20,30,28,.22);
    --shadow-lg:0 12px 40px -12px rgba(20,30,28,.4);
    --font:"Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    --paper:#101413; --surface:#181d1c; --surface-2:#212827; --surface-3:#2a3230;
    --ink:#e9eeec; --ink-soft:#c2c9c6; --muted:#8b938f; --faint:#5c6461;
    --line:#2c3432; --line-strong:#3a423f;
    --accent:#4fb3bc; --accent-ink:#6fc9d1; --accent-soft:#123230;
    --gate:#d9a94f; --gate-soft:#2d2611;
    --ok:#4cb877; --ok-bg:#16301f; --warn:#d9a94f; --warn-bg:#2f2711; --bad:#e0685a; --bad-bg:#331a17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px -12px rgba(0,0,0,.6);
    --shadow-lg:0 16px 48px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:var(--accent-soft)}

  /* header */
  .top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
  .title{font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap}
  .title small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.06em}
  .top-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);padding:8px 13px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hide{display:none!important}

  .syncpill{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .syncpill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .syncpill:hover{border-color:var(--accent);color:var(--accent)}
  .syncpill.on{color:var(--ok);border-color:var(--ok)} .syncpill.on::before{background:var(--ok)}
  .syncpill.busy{color:var(--warn);border-color:var(--warn)} .syncpill.busy::before{background:var(--warn)}
  .syncpill.err{color:var(--bad);border-color:var(--bad)} .syncpill.err::before{background:var(--bad)}

  .wrap{max-width:1180px;margin:0 auto;padding:18px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
  .kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;overflow:hidden;box-shadow:var(--shadow)}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--accent))}
  .kpi .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 11px;min-width:220px;flex:1;max-width:340px}
  .search input{border:0;outline:0;background:transparent;width:100%}
  .search .icon{color:var(--muted);flex:none}
  select.f{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-sm);padding:7px 11px;font-weight:600;cursor:pointer}

  /* product cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:10px}
  .pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .pcard .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .pcard h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.35}
  .pcard .pmeta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px}
  .phasetag{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;flex:none}
  .phasetag.done{background:var(--ok-bg);color:var(--ok)}
  .bar{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
  .bar.full>i{background:var(--ok)}
  .pcard .prow{display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .prow .pct{font-weight:800;font-variant-numeric:tabular-nums}
  .mini{display:flex;gap:5px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
  .dot{display:inline-flex;align-items:center;gap:4px}
  .dot::before{content:"";width:7px;height:7px;border-radius:50%}
  .dot.d::before{background:var(--ok)} .dot.p::before{background:var(--warn)} .dot.h::before{background:var(--bad)} .dot.t::before{background:var(--faint)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty svg{width:46px;height:46px;stroke:var(--line-strong);margin-bottom:10px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,24,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,96vw);background:var(--paper);box-shadow:var(--shadow-lg);z-index:61;transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface)}
  .dhead .x{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
  .dhead .x:hover{background:var(--surface-2);color:var(--ink)}
  .dbody{overflow:auto;padding:16px 18px 40px;flex:1}

  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field.full{grid-column:1/-1}
  .field label{font-size:11px;color:var(--muted);font-weight:700}
  .field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 9px;outline:0;transition:.14s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .summary{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
  .summary .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
  .summary .sbar{flex:1;min-width:140px}
  .summary .counts{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}

  .phasegrp{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
  .phasegrp>summary{list-style:none;cursor:pointer;padding:9px 13px;background:var(--surface-2);display:flex;align-items:center;gap:9px;font-weight:800;font-size:12.5px}
  .phasegrp>summary::-webkit-details-marker{display:none}
  .phasegrp>summary .chev{transition:.2s;color:var(--muted)}
  .phasegrp[open]>summary .chev{transform:rotate(90deg)}
  .phasegrp>summary .pp{color:var(--accent-ink);letter-spacing:.03em}
  .phasegrp>summary .pdone{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}

  .step{display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:11px 13px;border-top:1px solid var(--line)}
  .step .sno{grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
  .step.gate .sno{background:var(--gate);border-radius:6px;transform:rotate(45deg)}
  .step.gate .sno span{transform:rotate(-45deg)}
  .step .sname{font-weight:700;font-size:13.5px}
  .step .ssub{font-size:11px;color:var(--muted);margin-top:1px}
  .step .sctrl{grid-column:2;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .step .sctrl select,.step .sctrl input{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 7px;font-size:12px;outline:0}
  .step .sctrl .sstat{font-weight:800}
  .sstat.st-done{color:var(--ok);border-color:var(--ok)!important;background:var(--ok-bg)}
  .sstat.st-prog{color:var(--warn);border-color:var(--warn)!important;background:var(--warn-bg)}
  .sstat.st-hold{color:var(--bad);border-color:var(--bad)!important;background:var(--bad-bg)}
  .step .snote{grid-column:2;margin-top:7px;width:100%;resize:vertical;min-height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:12px;outline:0}
  .dlabel{font-size:10px;color:var(--faint);align-self:center}

  .drawer-foot{border-top:1px solid var(--line);padding:12px 18px;background:var(--surface);display:flex;gap:8px}
  .drawer-foot .btn{flex:1;justify-content:center}
  .btn.danger{border-color:transparent;background:transparent;color:var(--bad)}
  .btn.danger:hover{background:var(--bad-bg)}
  .btn.danger.armed{background:var(--bad);color:#fff}

  /* modal */
  .mscrim{position:fixed;inset:0;background:rgba(20,24,20,.42);opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .mscrim.show{opacity:1;pointer-events:auto}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:81;opacity:0;pointer-events:none;transition:.2s}
  .modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .mhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .mtitle{font-weight:800;font-size:15px}
  .mhead .x{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px;border-radius:8px}
  .mhead .x:hover{background:var(--surface-2);color:var(--ink)}
  .mbody{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
  .mlead{margin:0;font-size:12.5px;color:var(--ink-soft)}
  .mrow{display:flex;gap:8px} .mrow .btn{flex:1;justify-content:center}
  .mdiv{height:1px;background:var(--line);margin:3px 0}
  .warn-btn{border-color:var(--warn);color:var(--warn);justify-content:center;width:100%}
  .warn-btn:hover{background:var(--warn-bg);color:var(--warn)}
  .s-status{font-size:12.5px;font-weight:700;min-height:18px}
  .s-status.ok{color:var(--ok)} .s-status.err{color:var(--bad)} .s-status.busy{color:var(--warn)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:90;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 管理メニュー（書き出し・読み込み・共有） */
  .menu-wrap{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);right:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;flex-direction:column;gap:2px;z-index:50}
  .menu.show{display:flex}
  .menu .mlabel{font-size:10.5px;color:var(--faint);font-weight:700;padding:5px 11px 3px;letter-spacing:.04em}
  .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;padding:9px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer}
  .menu button:hover{background:var(--surface-2);color:var(--ink)}
  .menu button .icon{color:var(--muted);flex:none}
  .menu .sep{height:1px;background:var(--line);margin:4px 6px}

  /* 工程フロー オーバーレイ */
  .flow-overlay{position:fixed;inset:0;z-index:85;background:var(--paper);display:none;flex-direction:column}
  .flow-overlay.show{display:flex}
  .flow-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .flow-title{font-weight:800;font-size:15px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flow-overlay iframe{flex:1;border:0;width:100%;background:#fff}

  @media (max-width:820px){ .kpis{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){ .kpis{grid-template-columns:repeat(2,1fr)} .infogrid{grid-template-columns:1fr} .title small{display:none} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark">導</div>
      <div class="title">新商品導入フロー<small>PRODUCT LAUNCH TRACKER</small></div>
      <button class="syncpill" id="syncPill" title="共有の状態"></button>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="btnNew"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新規商品</button>
      <button class="btn ghost" id="btnFlow" title="工程フロー図を表示"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><path d="M6.5 8v4a2 2 0 002 2H14"/></svg>工程フロー</button>
      <button class="btn ghost" id="btnTheme" title="表示テーマ切替"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <div class="menu-wrap">
        <button class="btn ghost" id="btnAdmin" title="データ管理（書き出し・読み込み・共有）" aria-haspopup="true" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>管理</button>
        <div class="menu" id="adminMenu" role="menu">
          <div class="mlabel">データ管理（管理者用）</div>
          <button id="btnExport" role="menuitem"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>書き出し（バックアップ）</button>
          <button id="btnImport" role="menuitem"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>読み込み</button>
          <div class="sep"></div>
          <button id="btnSync" role="menuitem"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5.3L20 8M20 12a8 8 0 01-14 5.3L4 16"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>共有の設定</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="application/json" class="hide">
    </div>
  </div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="商品名・得意先で検索…"></div>
    <select class="f" id="fPhase"><option value="">全フェーズ</option></select>
    <select class="f" id="fSort"><option value="recent">新しい順</option><option value="progress">進捗が高い順</option><option value="progress_asc">進捗が低い順</option><option value="launch">発売日が近い順</option></select>
  </div>
  <div id="view"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="mscrim" id="mscrim"></div>
<div class="modal" id="syncModal" aria-hidden="true" role="dialog">
  <div class="mhead"><span class="mtitle">全員でデータを共有</span><button class="x" id="mClose" aria-label="閉じる"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="mbody">
    <p class="mlead">Googleスプレッドシートを保存先にして、全員が同じデータを読み書きします。初回のみ、下の「接続先URL」と「合言葉」を入力してください（管理者から共有されたもの）。設定手順は同フォルダの「共有版セットアップ手順.md」を参照。</p>
    <div class="field"><label>接続先URL（Apps Scriptの /exec URL）</label><input id="s_url" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="field"><label>合言葉（トークン）</label><input id="s_token" placeholder="管理者が設定した合言葉"></div>
    <div id="s_status" class="s-status"></div>
    <div class="mrow">
      <button class="btn" id="s_test">接続テスト</button>
      <button class="btn primary" id="s_connect">接続して読み込む</button>
    </div>
    <div class="mdiv"></div>
    <p class="mlead"><b>管理者の方へ（初回セットアップ）：</b> このブラウザの現在のデータをサーバーへ最初に保存します。以後は全員の編集が自動で同期されます。</p>
    <button class="btn warn-btn" id="s_push">このブラウザのデータをサーバーへ保存（初回アップロード）</button>
    <div class="mdiv"></div>
    <button class="btn ghost" id="s_disconnect" style="width:100%;justify-content:center">共有を解除（この端末のみで使う）</button>
  </div>
</div>

<div class="flow-overlay" id="flowOverlay" aria-hidden="true">
  <div class="flow-head">
    <span class="flow-title">新商品導入フロー（工程の全体像・24工程＋5ゲート）</span>
    <a class="btn ghost" id="flowOpenTab" href="flow.html" target="_blank" rel="noopener" title="別タブで開く"><svg class="icon" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5"/></svg>別タブ</a>
    <button class="btn primary" id="flowClose"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>閉じる</button>
  </div>
  <iframe id="flowFrame" title="工程フロー" src="about:blank" loading="lazy"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================= 工程定義（24工程＋5ゲート） ======================= */
const PHASES = [
  {key:"P0", name:"PHASE 0 引合・情報収集", steps:[

const STEP_LIST = [];   // {no,phaseKey,phaseName,name,owner,days,deliv,gate}
PHASES.forEach(p=>p.steps.forEach(s=>STEP_LIST.push({no:s[0],phaseKey:p.key,phaseName:p.name,name:s[1],owner:s[2],days:s[3],deliv:s[4],gate:!!s[5]})));
const TOTAL = STEP_LIST.length;   // 29
const STATUSES = ["未着手","進行中","完了","保留"];
const STAT_CLASS = {"完了":"st-done","進行中":"st-prog","保留":"st-hold","未着手":""};

/* ======================= helpers ======================= */
const $ = s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastTimer=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200); }

function newProduct(seed){
  const steps={}; STEP_LIST.forEach(s=>steps[s.no]={status:"未着手",start:"",done:"",note:""});
  return Object.assign({id:uid(),name:"",client:"",owner:"",start:"",launch:"",price:"",note:"",steps,createdAt:Date.now()}, seed||{});
}
function completed(p){ return STEP_LIST.reduce((n,s)=>n+((p.steps[s.no]||{}).status==="完了"?1:0),0); }
function progress(p){ return Math.round(completed(p)/TOTAL*100); }
function countStat(p,st){ return STEP_LIST.reduce((n,s)=>n+((p.steps[s.no]||{}).status===st?1:0),0); }
function currentPhase(p){
  for(const ph of PHASES){ for(const s of ph.steps){ if((p.steps[s[0]]||{}).status!=="完了") return ph.name; } }
  return "完了";
}

/* ======================= 状態・保存 ======================= */
const LS_KEY="shinshohin-donyu-v1";
function seedState(){
  const ex=newProduct({name:"減塩和風ドレッシング（200ml）",client:"○○スーパー（PB）",owner:"開発課 田中",start:"2026-05-01",launch:"2026-11-01",price:"本体128円 / 納入単価92円",note:"記入例。不要なら削除してください。"});
  const done={"01":"2026-05-07","02":"2026-05-20","03":"2026-05-29","G1":"2026-06-02","04":"2026-06-12","05":"2026-07-03","06":"2026-07-08","07":"2026-07-10","G2":"2026-07-14","08":"2026-07-17","09":"2026-07-21","10":"2026-07-22","G3":"2026-07-24"};
  Object.entries(done).forEach(([no,d])=>{ ex.steps[no].status="完了"; ex.steps[no].done=d; });
  ex.steps["11"]={status:"進行中",start:"2026-07-24",done:"",note:"保存試験中。加速試験で暫定4か月。本試験は9月末完了予定。"};
  ex.steps["12"]={status:"進行中",start:"2026-07-22",done:"",note:"外部機関へ分析依頼済み。8月上旬に結果予定。"};
  ex.steps["13"]={status:"未着手",start:"",done:"",note:"包材の版下は表示確定後に着手。"};
  return {version:1, products:[ex]};
}
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const p=JSON.parse(raw); if(p&&Array.isArray(p.products)) return p; } }catch(e){}
  return seedState();
}
let state = load();
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("保存容量オーバー：「書き出し」でバックアップしてください"); return false; }
  if(conn.url && conn.token && !syncing) schedulePush();
  return true;
}

/* ======================= 共有（Googleスプレッドシート）同期 ======================= */
const CONN_KEY="shinshohin-conn";
let conn=loadConn(), baseVersion=0, syncing=false, pushTimer=null;
function loadConn(){ try{ return JSON.parse(localStorage.getItem(CONN_KEY))||{url:"",token:""}; }catch(e){ return {url:"",token:""}; } }
function saveConn(){ try{ localStorage.setItem(CONN_KEY, JSON.stringify(conn)); }catch(e){} }
const isConnected=()=>!!(conn.url&&conn.token);
async function serverCall(payload){
  const res=await fetch(conn.url,{method:"POST",body:JSON.stringify(Object.assign({token:conn.token},payload))});
  const txt=await res.text(); let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("応答が不正です（URLを確認してください）"); }
  return j;
}
function setPill(kind,text){ const p=$("#syncPill"); if(!p)return; p.className="syncpill"+(kind?(" "+kind):""); p.textContent=text; }
function refreshPill(){ if(!isConnected()){ setPill("","未接続（この端末のみ）"); return; } setPill("on","共有中"); }
async function loadFromServer(silent){
  if(!isConnected()) return false;
  syncing=true; setPill("busy","読み込み中…");
  try{
    const j=await serverCall({action:"load"});
    if(!j.ok) throw new Error(j.error==="token"?"合言葉が違います":("サーバーエラー: "+j.error));
    if(j.data){ const parsed=JSON.parse(j.data); if(parsed&&Array.isArray(parsed.products)) state=parsed; }
    baseVersion=j.version||0;
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    render(); refreshPill();
    if(!silent) toast("最新データを読み込みました");
    return true;
  }catch(e){ setPill("err","同期エラー"); if(!silent) toast("読み込み失敗："+e.message); return false; }
  finally{ syncing=false; }
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushToServer,1200); }
async function pushToServer(){
  if(!isConnected()) return;
  setPill("busy","保存中…");
  try{
    const j=await serverCall({action:"save",baseVersion,data:JSON.stringify(state)});
    if(j.ok){ baseVersion=j.version; refreshPill(); }
    else if(j.error==="conflict"){ setPill("err","要更新"); toast("他の人が先に保存しました。バッジまたは『共有』→『接続して読み込む』で最新を取得してください（この端末の変更は上書きしていません）"); }
    else if(j.error==="token"){ setPill("err","合言葉エラー"); }
    else setPill("err","保存エラー");
  }catch(e){ setPill("err","保存エラー"); }
}
function openSync(){ $("#s_url").value=conn.url; $("#s_token").value=conn.token; sStatus("", isConnected()?"現在：共有中":"現在：未接続"); $("#mscrim").classList.add("show"); $("#syncModal").classList.add("show"); }
function closeSync(){ $("#mscrim").classList.remove("show"); $("#syncModal").classList.remove("show"); }
function sStatus(kind,msg){ const s=$("#s_status"); s.className="s-status "+(kind||""); s.textContent=msg; }

/* ======================= 描画 ======================= */
let filter={q:"",phase:"",sort:"recent"};
function render(){
  // KPI
  const ps=state.products;
  const avg = ps.length? Math.round(ps.reduce((a,p)=>a+progress(p),0)/ps.length):0;
  const launched = ps.filter(p=>p.steps["24"] && p.steps["24"].status==="完了").length;
  const proposing = ps.filter(p=>{const c=currentPhase(p); return c.indexOf("PHASE 6")===0;}).length;
  const dev = ps.filter(p=>{const c=currentPhase(p); return ["PHASE 1","PHASE 2","PHASE 3","PHASE 4"].some(x=>c.indexOf(x)===0);}).length;
  const kpi=[
    ["--accent",ps.length,"登録商品"],
    ["--warn",dev,"開発・検証中"],
    ["--accent",proposing,"提案・商談中"],
    ["--ok",launched,"発売済み"],
    ["--accent",avg+"%","平均進捗"],
  ];
  $("#kpis").innerHTML=kpi.map(k=>`<div class="kpi" style="--k:var(${k[0]})"><div class="n">${k[1]}</div><div class="l">${k[2]}</div></div>`).join("");

  // フェーズフィルタ options
  const fp=$("#fPhase"); const cur=fp.value;
  fp.innerHTML='<option value="">全フェーズ</option>'+PHASES.map(p=>`<option value="${p.name}">${esc(p.name)}</option>`).join("")+'<option value="完了">完了</option>';
  fp.value=cur;

  // list
  let list=ps.slice();
  if(filter.q){ const q=filter.q.toLowerCase(); list=list.filter(p=>((p.name||"")+(p.client||"")+(p.owner||"")).toLowerCase().includes(q)); }
  if(filter.phase){ list=list.filter(p=>currentPhase(p)===filter.phase); }
  if(filter.sort==="recent") list.sort((a,b)=>b.createdAt-a.createdAt);
  else if(filter.sort==="progress") list.sort((a,b)=>progress(b)-progress(a));
  else if(filter.sort==="progress_asc") list.sort((a,b)=>progress(a)-progress(b));
  else if(filter.sort==="launch") list.sort((a,b)=>(a.launch||"9999").localeCompare(b.launch||"9999"));

  const view=$("#view");
  if(!list.length){
    view.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><div>${ps.length?"該当する商品がありません":"右上の「新規商品」から登録してください"}</div></div>`;
    return;
  }
  const g=el("div","grid");
  list.forEach(p=>g.appendChild(card(p)));
  view.innerHTML=""; view.appendChild(g);
}
function card(p){
  const pct=progress(p), cp=currentPhase(p), full=pct===100;
  const c=el("div","pcard");
  c.innerHTML=`
    <div class="pc-top">
      <div style="min-width:0">
        <h3>${esc(p.name||"（商品名未設定）")}</h3>
        <div class="pmeta">${p.client?`<span>${esc(p.client)}</span>`:""}${p.owner?`<span>担当 ${esc(p.owner)}</span>`:""}${p.launch?`<span>発売目標 ${esc(p.launch)}</span>`:""}</div>
      </div>
      <span class="phasetag${full?" done":""}">${esc(cp)}</span>
    </div>
    <div class="prow"><span class="mini">全体進捗</span><span class="pct">${pct}%</span></div>
    <div class="bar${full?" full":""}"><i style="width:${pct}%"></i></div>
    <div class="mini">
      <span class="dot d">完了 ${countStat(p,"完了")}</span>
      <span class="dot p">進行中 ${countStat(p,"進行中")}</span>
      <span class="dot h">保留 ${countStat(p,"保留")}</span>
      <span class="dot t">未着手 ${countStat(p,"未着手")}</span>
    </div>`;
  c.addEventListener("click",()=>openDetail(p.id));
  return c;
}

/* ======================= 詳細ドロワー ======================= */
let openId=null;
function openDetail(id){
  openId=id;
  const p=state.products.find(x=>x.id===id); if(!p) return;
  const d=$("#drawer");
  d.innerHTML="";
  // head
  const head=el("div","dhead");
  head.innerHTML=`<div style="font-weight:800;font-size:15px">${esc(p.name||"（商品名未設定）")}</div>`;
  const x=el("button","x",`<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`);
  x.onclick=closeDetail; head.appendChild(x);
  d.appendChild(head);

  const body=el("div","dbody");
  // 商品情報
  const info=el("div","infogrid");
  const F=(label,key,type,full)=>{
    const f=el("div","field"+(full?" full":"")); f.innerHTML=`<label>${label}</label>`;
    const inp=el(type==="ta"?"textarea":"input");
    if(type==="date") inp.type="date"; else if(type!=="ta") inp.type="text";
    inp.value=p[key]||"";
    // 入力を即時に反映（ヘッダーの商品名も追従）
    inp.addEventListener("input",()=>{ p[key]=inp.value; if(key==="name") head.firstChild.textContent=p.name||"（商品名未設定）"; });
    // 確定時（フォーカスを外したとき）に保存し、一覧カードへ反映
    inp.addEventListener("change",()=>{ p[key]=inp.value; persist(); render(); });
    f.appendChild(inp); return f;
  };
  info.appendChild(F("商品名","name","text"));
  info.appendChild(F("得意先","client","text"));
  info.appendChild(F("商品担当","owner","text"));
  info.appendChild(F("想定売価 / 納入単価","price","text"));
  info.appendChild(F("開始日","start","date"));
  info.appendChild(F("目標発売日","launch","date"));
  info.appendChild(F("メモ","note","ta",true));
  body.appendChild(info);

  // サマリー
  const sum=el("div","summary"); sum.id="dsummary"; sum.innerHTML=summaryHTML(p);
  body.appendChild(sum);

  // フェーズ別チェックリスト
  const curPhaseName=currentPhase(p);
  PHASES.forEach(ph=>{
    const grp=el("details","phasegrp");
    if(ph.name===curPhaseName) grp.open=true;
    const done=ph.steps.filter(s=>(p.steps[s[0]]||{}).status==="完了").length;
    const sm=el("summary");
    sm.innerHTML=`<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="pp">${esc(ph.name)}</span><span class="pdone">${done}/${ph.steps.length}</span>`;
    grp.appendChild(sm);
    ph.steps.forEach(s=>grp.appendChild(stepRow(p,s)));
    body.appendChild(grp);
  });
  d.appendChild(body);

  // foot
  const foot=el("div","drawer-foot");
  const trash=`<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M6 6v14a1 1 0 001 1h10a1 1 0 001-1V6"/><path d="M10 11v6M14 11v6"/></svg>`;
  const del=el("button","btn danger",trash+"削除");
  del.onclick=()=>{ if(del.classList.contains("armed")){ state.products=state.products.filter(x=>x.id!==id); persist(); closeDetail(); render(); toast("削除しました"); } else { del.classList.add("armed"); del.innerHTML=trash+"もう一度で削除"; setTimeout(()=>{del.classList.remove("armed");del.innerHTML=trash+"削除";},2600); } };
  const dup=el("button","btn","複製");
  dup.onclick=()=>{ const np=JSON.parse(JSON.stringify(p)); np.id=uid(); np.name=(p.name||"商品")+"（複製）"; np.createdAt=Date.now(); state.products.push(np); persist(); render(); openDetail(np.id); toast("複製しました"); };
  const save=el("button","btn primary",`<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存`);
  save.onclick=()=>{ if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); persist(); toast("保存しました"); closeDetail(); };
  foot.appendChild(del); foot.appendChild(dup); foot.appendChild(save);
  d.appendChild(foot);

  $("#scrim").classList.add("show"); d.classList.add("show"); d.setAttribute("aria-hidden","false");
}
function summaryHTML(p){
  const pct=progress(p);
  return `<div class="big">${pct}%</div>
    <div class="sbar"><div class="bar${pct===100?" full":""}"><i style="width:${pct}%"></i></div>
      <div class="counts" style="margin-top:7px">
        <span>完了 ${countStat(p,"完了")} / ${TOTAL}</span>
        <span>進行中 ${countStat(p,"進行中")}</span>
        <span>保留 ${countStat(p,"保留")}</span>
        <span>現在：${esc(currentPhase(p))}</span>
      </div>
    </div>`;
}
function updateSummary(p){ const s=$("#dsummary"); if(s) s.innerHTML=summaryHTML(p); }
function stepRow(p,s){
  const [no,name,owner,days,deliv,gate]=s;
  const st=p.steps[no]||(p.steps[no]={status:"未着手",start:"",done:"",note:""});
  const row=el("div","step"+(gate?" gate":""));
  row.innerHTML=`<div class="sno"><span>${gate?no:no}</span></div>
    <div><div class="sname">${gate?"【ゲート】":""}${esc(name)}</div><div class="ssub">${esc(owner)}・目安 ${esc(days)}｜${esc(deliv)}</div></div>`;
  const ctrl=el("div","sctrl");
  const sel=el("select","sstat "+(STAT_CLASS[st.status]||""));
  sel.innerHTML=STATUSES.map(v=>`<option${v===st.status?" selected":""}>${v}</option>`).join("");
  sel.addEventListener("change",()=>{ st.status=sel.value; sel.className="sstat "+(STAT_CLASS[st.status]||""); if(st.status==="完了"&&!st.done) st.done=new Date().toISOString().slice(0,10); persist(); updateSummary(p); render(); });
  const d1=el("input"); d1.type="date"; d1.value=st.start||""; d1.title="開始日";
  d1.addEventListener("change",()=>{ st.start=d1.value; persist(); });
  const d2=el("input"); d2.type="date"; d2.value=st.done||""; d2.title="完了日";
  d2.addEventListener("change",()=>{ st.done=d2.value; persist(); });
  ctrl.appendChild(sel);
  ctrl.appendChild(Object.assign(el("span","dlabel"),{textContent:"開始"})); ctrl.appendChild(d1);
  ctrl.appendChild(Object.assign(el("span","dlabel"),{textContent:"完了"})); ctrl.appendChild(d2);
  row.appendChild(ctrl);
  const note=el("textarea","snote"); note.placeholder="備考（差戻し理由・暫定値・申し送りなど）"; note.value=st.note||"";
  note.addEventListener("change",()=>{ st.note=note.value; persist(); });
  row.appendChild(note);
  return row;
}
function closeDetail(){ openId=null; $("#scrim").classList.remove("show"); $("#drawer").classList.remove("show"); $("#drawer").setAttribute("aria-hidden","true"); }

/* ======================= 書き出し／読み込み／CSV ======================= */
function download(name,text,mime){ const b=new Blob([text],{type:mime||"application/json"}); const u=URL.createObjectURL(b); const a=el("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function exportJSON(){ download("新商品導入フロー_"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(state,null,2)); }
function importJSON(file){ const r=new FileReader(); r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p||!Array.isArray(p.products)) throw 0; state=p; persist(); render(); toast("読み込みました"); }catch(e){ toast("読み込めませんでした（ファイル形式を確認）"); } }; r.readAsText(file); }

/* ======================= 配線 ======================= */
$("#btnNew").addEventListener("click",()=>{ const p=newProduct(); state.products.push(p); persist(); render(); openDetail(p.id); });
$("#btnExport").addEventListener("click",exportJSON);
$("#btnImport").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
$("#btnTheme").addEventListener("click",()=>{ const cur=document.documentElement.getAttribute("data-theme"); const nx=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); try{localStorage.setItem("shinshohin-theme",nx);}catch(e){} });
$("#q").addEventListener("input",e=>{ filter.q=e.target.value; render(); });
$("#fPhase").addEventListener("change",e=>{ filter.phase=e.target.value; render(); });
$("#fSort").addEventListener("change",e=>{ filter.sort=e.target.value; render(); });
$("#scrim").addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeDetail(); closeSync(); closeFlow(); closeAdmin(); } });

/* 工程フロー オーバーレイ */
function openFlow(){ const f=$("#flowFrame"); if(f.getAttribute("src")==="about:blank") f.src="flow.html"; $("#flowOverlay").classList.add("show"); $("#flowOverlay").setAttribute("aria-hidden","false"); }
function closeFlow(){ $("#flowOverlay").classList.remove("show"); $("#flowOverlay").setAttribute("aria-hidden","true"); }
$("#btnFlow").addEventListener("click",openFlow);
$("#flowClose").addEventListener("click",closeFlow);

/* 管理メニュー（書き出し・読み込み・共有） */
function closeAdmin(){ $("#adminMenu").classList.remove("show"); $("#btnAdmin").setAttribute("aria-expanded","false"); }
$("#btnAdmin").addEventListener("click",e=>{ e.stopPropagation(); const open=$("#adminMenu").classList.toggle("show"); $("#btnAdmin").setAttribute("aria-expanded",open?"true":"false"); });
$("#adminMenu").addEventListener("click",e=>{ if(e.target.closest("button")) closeAdmin(); });
document.addEventListener("click",closeAdmin);

/* 共有モーダル配線 */
$("#btnSync").addEventListener("click",openSync);
$("#syncPill").addEventListener("click",()=>{ if(isConnected()) loadFromServer(); else openSync(); });
$("#mClose").addEventListener("click",closeSync);
$("#mscrim").addEventListener("click",closeSync);
$("#s_test").addEventListener("click",async()=>{
  const u=$("#s_url").value.trim(),t=$("#s_token").value.trim();
  if(!u||!t){ sStatus("err","URLと合言葉を入力してください"); return; }
  sStatus("busy","接続テスト中…"); const save={...conn}; conn={url:u,token:t};
  try{ const j=await serverCall({action:"load"}); if(j.ok) sStatus("ok","接続OK（サーバーの版: "+(j.version||0)+"）"); else sStatus("err",j.error==="token"?"合言葉が違います":("エラー: "+j.error)); }
  catch(e){ sStatus("err","接続できません："+e.message); } finally{ conn=save; }
});
$("#s_connect").addEventListener("click",async()=>{
  const u=$("#s_url").value.trim(),t=$("#s_token").value.trim();
  if(!u||!t){ sStatus("err","URLと合言葉を入力してください"); return; }
  conn={url:u,token:t}; saveConn(); sStatus("busy","読み込み中…");
  const ok=await loadFromServer(true);
  if(ok){ sStatus("ok","接続しました。全員のデータを表示しています"); refreshPill(); setTimeout(closeSync,700); }
  else sStatus("err","読み込めませんでした。URLと合言葉を確認してください");
});
$("#s_push").addEventListener("click",async()=>{
  const u=$("#s_url").value.trim(),t=$("#s_token").value.trim();
  if(!u||!t){ sStatus("err","URLと合言葉を入力してください"); return; }
  if(!confirm("このブラウザの現在のデータで、サーバー側を上書きします。よろしいですか？")) return;
  conn={url:u,token:t}; saveConn(); sStatus("busy","アップロード中…");
  try{ const cur=await serverCall({action:"load"}); baseVersion=cur.ok?(cur.version||0):0;
    const j=await serverCall({action:"save",baseVersion,data:JSON.stringify(state)});
    if(j.ok){ baseVersion=j.version; refreshPill(); sStatus("ok","サーバーへ保存しました。他の人は『接続して読み込む』で表示できます"); }
    else sStatus("err","保存できませんでした："+j.error);
  }catch(e){ sStatus("err","保存できません："+e.message); }
});
$("#s_disconnect").addEventListener("click",()=>{ conn={url:"",token:""}; saveConn(); baseVersion=0; refreshPill(); sStatus("","共有を解除しました（この端末のデータのみ表示します）"); });
window.addEventListener("focus",()=>{ if(isConnected()&&!syncing) loadFromServer(true); });

/* 起動 */
try{ const th=localStorage.getItem("shinshohin-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
/* ワンクリック接続リンク：URLの #s=... に接続情報が入っていれば自動接続し、鍵をアドレスバーから消す */
(function hashConnect(){
  try{
    const m=location.hash.match(/[#&]s=([^&]+)/);
    if(m){
      let b=m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
      const obj=JSON.parse(decodeURIComponent(escape(atob(b))));
      if(obj&&obj.u&&obj.t){ conn={url:obj.u,token:obj.t}; saveConn(); }
    }
  }catch(e){}
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
})();
render(); refreshPill();
if(isConnected()) loadFromServer(true); else persist();
</script>
</body>
